plugins {
    id 'com.android.application'
}

android {
    namespace 'com.droidforge.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.droidforge.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader: menyajikan HTML lokal lewat domain https virtual
    // agar aplikasi berjalan dalam "secure context" (clipboard & localStorage normal)
    implementation 'androidx.webkit:webkit:1.11.0'
}
