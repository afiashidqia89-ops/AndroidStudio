name: Deploy Web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'android/app/src/main/assets/index.html' ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan file web
        run: |
          mkdir -p public
          cp android/app/src/main/assets/index.html public/index.html

      - name: Konfigurasi Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
