name: Deploy Web (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan berkas
        run: |
          mkdir -p public
          cp android/app/src/main/assets/droidforge-studio.html public/index.html

      - name: Konfigurasi Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy ke Pages
        id: deployment
        uses: actions/deploy-pages@v4
