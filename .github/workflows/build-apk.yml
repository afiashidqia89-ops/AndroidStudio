name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Tambahkan platform Android (jika belum ada)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Pasang ikon aplikasi
        run: |
          if [ -f scripts/install-icons.sh ]; then
            bash scripts/install-icons.sh || true
          fi

      - name: Sinkronkan web assets
        run: npx cap sync android

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Retensi-KSA1G-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
